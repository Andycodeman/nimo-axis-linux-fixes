[package]
name = "nimo-control-center"
version = "1.2.1"
edition = "2024"
description = "Control Center for the NIMO AXIS 395 (N161L) on Linux: keyboard RGB, power modes, fans, key toggles, charge limit"
license = "GPL-3.0-or-later"

[dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[build-dependencies]
slint-build = "1.19"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
